<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Sample App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .search-bar {
      margin: 20px;
    }

    .filter {
      margin-top: 10px;
    }

    .search-results {
      margin-top: 20px;
    }

    .search-results li {
      list-style: none;
      padding: 5px;
      border: 1px solid #ddd;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search Star Wars characters..."
      oninput="searchCharacters(this.value)" />
    <div class="filter">
      <label for="genderFilter">Filter by Gender:</label>
      <select id="genderFilter" onchange="filterByGender(this.value)">
        <option value="">All</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="n/a">Other</option>
      </select>
    </div>
    <ul id="results"></ul>
  </div>

  <script>
    // Inline storage of state-like variables
    let lastSearchTerm = '';
    let allResults = [];
    let filteredResults = [];

    // Main search function triggered by input
    async function searchCharacters(value) {
      lastSearchTerm = value; // Save last search term globally
      if (value === '') {
        clearResults();
        return;
      }
      const url = `https://swapi.py4e.com/api/people/?search=${value}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        allResults = data.results;
        filteredResults = [...allResults];
        displayResults(allResults);
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    // Gender filter function triggered by dropdown change
    function filterByGender(gender) {
      if (!allResults || allResults.length === 0) {
        return;
      }
      if (gender === '') {
        filteredResults = [...allResults];
      } else {
        filteredResults = allResults.filter((person) => person.gender === gender);
      }
      displayResults(filteredResults);
    }

    // Display results function with inline logic
    function displayResults(results) {
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = ''; // Clear previous results
      for (let i = 0; i < results.length; i++) {
        const li = document.createElement('li');
        li.textContent = `${results[i].name}`;
        resultsContainer.appendChild(li);
      }
    }

    // Clear results with extra complexity
    function clearResults() {
      const ul = document.getElementById('results');
      while (ul.firstChild) {
        ul.removeChild(ul.firstChild);
      }
      filteredResults = [];
    }
  </script>
</body>
</body>

</html>
